<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="og-bot-discord: a Death Star firing on a cracking moon">
  <title>og-bot-discord</title>

  <defs>
    <!-- deep space -->
    <radialGradient id="space" cx="62%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#173352"/>
      <stop offset="45%" stop-color="#0d1c30"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>

    <!-- moon body, lit from the upper right (where the RIP sits) -->
    <radialGradient id="moon" cx="72%" cy="26%" r="88%">
      <stop offset="0%" stop-color="#e6ecf3"/>
      <stop offset="42%" stop-color="#a9b6c6"/>
      <stop offset="78%" stop-color="#5d6b7d"/>
      <stop offset="100%" stop-color="#2b3542"/>
    </radialGradient>

    <!-- death star hull -->
    <radialGradient id="hull" cx="34%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#8b98a8"/>
      <stop offset="55%" stop-color="#4a5563"/>
      <stop offset="100%" stop-color="#1b2230"/>
    </radialGradient>

    <radialGradient id="dish" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#7ee3ff"/>
      <stop offset="35%" stop-color="#2b96bd"/>
      <stop offset="100%" stop-color="#123444"/>
    </radialGradient>

    <!-- glowing fracture -->
    <linearGradient id="crack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffb03a"/>
      <stop offset="100%" stop-color="#ff5b2e"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9f6ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8fe9ff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#3fd0ff" stop-opacity=".95"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd8ff" stop-opacity=".05"/>
      <stop offset="40%" stop-color="#4fd8ff" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#4fd8ff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#4fd8ff" stop-opacity=".02"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tightGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter name="grain" id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="disc"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="moonClip"><circle cx="206" cy="318" r="132"/></clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#space)"/>

    <!-- faint nebula wash + film grain so the flat background reads as space -->
    <ellipse cx="352" cy="150" rx="210" ry="150" fill="#2a6f9e" opacity=".16" filter="url(#softGlow)"/>
    <rect width="512" height="512" filter="url(#grain)" opacity=".05"/>

    <!-- starfield -->
    <g fill="#eaf4ff">
      <circle cx="58" cy="66" r="2.1" opacity=".9"/>
      <circle cx="126" cy="128" r="1.2" opacity=".55"/>
      <circle cx="196" cy="52" r="1.6" opacity=".75"/>
      <circle cx="268" cy="104" r="1" opacity=".45"/>
      <circle cx="332" cy="46" r="1.7" opacity=".8"/>
      <circle cx="424" cy="96" r="1.3" opacity=".6"/>
      <circle cx="470" cy="188" r="2" opacity=".85"/>
      <circle cx="86" cy="212" r="1.4" opacity=".6"/>
      <circle cx="38" cy="330" r="1.8" opacity=".7"/>
      <circle cx="64" cy="448" r="1.2" opacity=".5"/>
      <circle cx="150" cy="486" r="1.5" opacity=".6"/>
      <circle cx="396" cy="440" r="1.3" opacity=".55"/>
      <circle cx="462" cy="366" r="1.7" opacity=".7"/>
      <circle cx="360" cy="286" r="1" opacity=".4"/>
      <circle cx="240" cy="180" r="1.1" opacity=".45"/>
    </g>

    <!-- orbital ring behind the moon -->
    <g transform="rotate(-24 256 300)">
      <ellipse cx="256" cy="300" rx="228" ry="70" fill="none" stroke="url(#ring)" stroke-width="4"/>
    </g>

    <!-- ============ the moon ============ -->
    <circle cx="206" cy="318" r="132" fill="url(#moon)"/>
    <g clip-path="url(#moonClip)">
      <!-- craters -->
      <g fill="#54626f" opacity=".55">
        <ellipse cx="150" cy="262" rx="26" ry="22"/>
        <ellipse cx="252" cy="240" rx="16" ry="14"/>
        <ellipse cx="298" cy="330" rx="20" ry="17"/>
        <ellipse cx="168" cy="386" rx="30" ry="25"/>
        <ellipse cx="106" cy="330" rx="14" ry="12"/>
        <ellipse cx="234" cy="404" rx="17" ry="14"/>
      </g>
      <g fill="#d6dee8" opacity=".35">
        <ellipse cx="150" cy="256" rx="26" ry="20"/>
        <ellipse cx="168" cy="379" rx="30" ry="22"/>
        <ellipse cx="298" cy="324" rx="20" ry="15"/>
      </g>

      <!-- terminator: the far side falls into shadow -->
      <circle cx="206" cy="318" r="132" fill="#050a12" opacity=".42"
              transform="translate(-52 34)"/>

      <!-- the moonbreak fracture, glowing from the core -->
      <g stroke="url(#crack)" stroke-linecap="round" fill="none">
        <path d="M318 246 L268 292 L292 316 L236 366 L254 398 L206 448"
              stroke-width="13" opacity=".35" filter="url(#softGlow)"/>
        <path d="M318 246 L268 292 L292 316 L236 366 L254 398 L206 448"
              stroke-width="6.5"/>
        <path d="M268 292 L214 274 M292 316 L340 330 M236 366 L182 352 M254 398 L300 418"
              stroke-width="3.4" opacity=".85"/>
        <path d="M214 274 L176 250 M182 352 L140 356" stroke-width="2" opacity=".6"/>
      </g>
    </g>

    <!-- rim light on the lunar limb, cast by the beam impact -->
    <circle cx="206" cy="318" r="132" fill="none" stroke="#ffce7a"
            stroke-width="2.6" opacity=".55"
            stroke-dasharray="115 714" stroke-dashoffset="184"/>

    <!-- debris blown off the crust -->
    <g fill="#c3ccd8">
      <path d="M352 258 l13 2 -2 11 -12 -3z" opacity=".9" transform="rotate(18 358 264)"/>
      <path d="M372 300 l10 1 -1 9 -10 -2z" opacity=".7" transform="rotate(-24 377 305)"/>
      <path d="M330 392 l12 3 -3 9 -10 -3z" opacity=".75" transform="rotate(32 336 398)"/>
      <path d="M300 446 l9 1 -1 8 -8 -2z" opacity=".55" transform="rotate(-14 304 450)"/>
      <circle cx="392" cy="352" r="3.2" opacity=".6"/>
      <circle cx="286" cy="196" r="2.6" opacity=".5"/>
    </g>

    <!-- ============ the RIP ============ -->
    <!-- superlaser, fired down the fracture -->
    <g>
      <path d="M362 150 L318 246" stroke="url(#beam)" stroke-width="17"
            stroke-linecap="round" opacity=".4" filter="url(#softGlow)"/>
      <path d="M362 150 L318 246" stroke="url(#beam)" stroke-width="6"
            stroke-linecap="round"/>
      <!-- impact flare where it meets the crust -->
      <circle cx="318" cy="246" r="30" fill="#ffb03a" opacity=".3" filter="url(#softGlow)"/>
      <circle cx="318" cy="246" r="9" fill="#fff6d8" filter="url(#tightGlow)"/>
    </g>

    <g transform="translate(384 116)">
      <circle r="76" fill="#4fd8ff" opacity=".13" filter="url(#softGlow)"/>
      <circle r="62" fill="url(#hull)"/>
      <!-- equatorial trench -->
      <path d="M-62 6 A62 62 0 0 0 62 6" fill="none" stroke="#0f151f" stroke-width="7" opacity=".9"/>
      <path d="M-62 6 A62 62 0 0 0 62 6" fill="none" stroke="#96a5b6" stroke-width="1.6" opacity=".5"
            transform="translate(0 -5)"/>
      <!-- hull plating -->
      <g stroke="#0f151f" stroke-width="1.4" opacity=".35" fill="none">
        <path d="M-58 -22 A62 62 0 0 1 58 -22"/>
        <path d="M-46 30 A62 62 0 0 0 46 30"/>
        <path d="M-6 -62 L-6 6 M26 -57 L26 4"/>
      </g>
      <!-- concave superlaser dish -->
      <circle cx="-18" cy="-24" r="21" fill="url(#dish)"/>
      <circle cx="-18" cy="-24" r="21" fill="none" stroke="#0f151f" stroke-width="2.4" opacity=".7"/>
      <circle cx="-18" cy="-24" r="7" fill="#d9f7ff" filter="url(#tightGlow)"/>
      <!-- terminator on the hull -->
      <circle r="62" fill="#050a12" opacity=".34" transform="translate(16 18)"/>
      <circle r="62" fill="none" stroke="#9fd9f0" stroke-width="1.8" opacity=".45"
              stroke-dasharray="86 300" stroke-dashoffset="150"/>
    </g>

    <!-- inner bevel so the badge has an edge -->
    <circle cx="256" cy="256" r="254" fill="none" stroke="#7fe4ff" stroke-width="4" opacity=".22"/>
    <circle cx="256" cy="256" r="246" fill="none" stroke="#050a12" stroke-width="2" opacity=".35"/>
  </g>
</svg>
