name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Vérifie que l'image se construit, sans la pousser : une PR qui casse le
      # Dockerfile doit échouer ici plutôt qu'au merge sur master.
      - name: Build de contrôle de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
