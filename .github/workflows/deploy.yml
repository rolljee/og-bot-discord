name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un seul déploiement à la fois : le bot est mono-instance, enchaîner deux
# redéploiements concurrents ne ferait que provoquer des reconnexions gateway
# inutiles.
concurrency:
  group: deploy-og-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build & push GHCR
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 uniquement : les Serverless Containers Scaleway tournent
      # sur amd64, construire arm64 doublerait la durée du build pour rien.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redéploiement Scaleway
    needs: build
    runs-on: ubuntu-latest

    # Les étapes ci-dessous sont sautées quand les secrets d'infrastructure sont
    # absents, ce qui couvre deux cas réels :
    #   - l'amorçage, où l'image doit exister sur GHCR avant que Terraform
    #     puisse créer le container et donc fournir son ID ;
    #   - les forks de ce dépôt public, qui n'ont pas ces secrets et dont la CI
    #     serait sinon rouge en permanence.
    #
    # Le test se fait sur `env` et non sur `secrets` : le contexte `secrets`
    # n'est autorisé dans aucun `if`, ni au niveau job ni au niveau step. Il est
    # en revanche autorisé dans `env` au niveau du job, et `env` est lisible
    # depuis un `if` de step — d'où ce passage de relais.
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
      REGION: ${{ secrets.SCW_REGION }}

    steps:
      - name: Vérifier la présence des secrets d'infrastructure
        if: env.CONTAINER_ID == ''
        run: |
          echo "::notice::Secrets d'infrastructure absents, deploiement saute."
      # Terraform déclare l'image en `:latest` et n'est jamais exécuté ici : ce
      # dépôt reste indépendant de l'infrastructure. Il lui suffit de demander à
      # Scaleway de re-tirer le tag.
      #
      # Les credentials proviennent d'une application IAM dédiée, limitée au
      # projet Kompas (voir og-bot-discord.tf côté infra). Le token Discord,
      # lui, n'est jamais exposé à la CI.
      - name: Déclencher le redéploiement
        if: env.CONTAINER_ID != ''
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${CONTAINER_ID}/redeploy" \
            > /dev/null

          echo "Redéploiement demandé."

      # Sans cette étape, la CI serait verte même si le container ne démarre
      # pas : l'appel de redéploiement est asynchrone.
      - name: Attendre que le container soit prêt
        if: env.CONTAINER_ID != ''
        run: |
          set -euo pipefail

          url="https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${CONTAINER_ID}"

          for attempt in $(seq 1 40); do
            body=$(curl --fail-with-body --silent --show-error \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" "$url")

            status=$(echo "$body" | jq -r '.status')
            echo "[$attempt/40] status=$status"

            case "$status" in
              ready)
                echo "Container en ligne."
                exit 0
                ;;
              error)
                echo "::error::Le déploiement a échoué : $(echo "$body" | jq -r '.error_message')"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Le container n'est pas devenu 'ready' en 10 minutes."
          exit 1
